services:
  app:
    image: arshdadwal99/project:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project
    ports:
      - "80:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
